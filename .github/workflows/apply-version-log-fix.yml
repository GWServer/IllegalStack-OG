name: Apply version and logging fix

on:
  pull_request:
    branches:
      - agent/fix-version-detection-logging
    types:
      - opened

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'agent/trigger-version-detection-logging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-version-detection-logging
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: '17'

      - name: Apply exact replacements
        shell: python
        run: |
          from pathlib import Path

          listener = Path("src/main/java/main/java/me/dniym/listeners/fListener.java")
          listener_text = listener.read_text(encoding="utf-8")
          old_guard = '&& !ver.contains("v1_18") && !ver.contains("V1_19") && !ver.contains("v1_20") && !ver.contains("V1_21"))'
          new_guard = '&& !ver.contains("v1_18") && !ver.contains("v1_19") && !ver.contains("v1_20") && !ver.contains("v1_21"))'
          assert listener_text.count(old_guard) == 1
          listener.write_text(listener_text.replace(old_guard, new_guard), encoding="utf-8")

          plugin = Path("src/main/java/main/java/me/dniym/IllegalStack.java")
          plugin_text = plugin.read_text(encoding="utf-8")
          old_names = 'getLogger("Items matching the following names will be removed from players inventories: " + whitelisted);'
          new_names = 'getLogger("Loaded " + Protections.ItemNamesToRemove.getTxtSet().size() + " configured item name filters.");'
          old_lore = 'getLogger("Items matching the following lore will be removed from players inventories: " + whitelisted);'
          new_lore = 'getLogger("Loaded " + Protections.ItemLoresToRemove.getTxtSet().size() + " configured item lore filters.");'
          assert plugin_text.count(old_names) == 1
          assert plugin_text.count(old_lore) == 1
          plugin.write_text(plugin_text.replace(old_names, new_names).replace(old_lore, new_lore), encoding="utf-8")

      - name: Run tests
        run: ./gradlew test

      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/apply-version-log-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/main/java/me/dniym/listeners/fListener.java src/main/java/main/java/me/dniym/IllegalStack.java .github/workflows/apply-version-log-fix.yml
          git commit -m "Fix version detection and filter logging"
          git push origin HEAD:agent/fix-version-detection-logging
